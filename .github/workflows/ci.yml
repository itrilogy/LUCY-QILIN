name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hub]" pytest ruff
      - name: Lint (undefined names and syntax)
        run: ruff check .
      - name: Compile
        run: python -m compileall -q store
      - name: Test
        run: python -m pytest -q
      - name: Portal JS syntax
        run: python scripts/check_portal_js.py
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Wheel install smoke
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/qilin-wheel" dist/*.whl
          PYTHONPATH="$RUNNER_TEMP/qilin-wheel" python -c "from store.http_api import PORTAL, DESIGN_FILES; from store.backup import backup; assert PORTAL.is_file(); assert all(p.is_file() for p in DESIGN_FILES.values()), '门户静态资源没打进 wheel'; print('wheel smoke ok')"
